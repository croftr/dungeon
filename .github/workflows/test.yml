name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: dungeon-crawler/package-lock.json

      - name: Install dependencies
        working-directory: dungeon-crawler
        run: npm ci

      - name: Run tests
        working-directory: dungeon-crawler
        run: npm test
