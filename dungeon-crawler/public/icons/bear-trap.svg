<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Iron Base -->
  <circle cx="50" cy="50" r="45" fill="#2c2c2c" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Jaws (Halves) -->
  <path d="M10,50 A40,40 0 0,1 90,50" fill="none" stroke="#4a4a4a" stroke-width="4"/>
  <path d="M10,50 A40,40 0 0,0 90,50" fill="none" stroke="#4a4a4a" stroke-width="4"/>
  
  <!-- Jagged Teeth (Top Jaw) -->
  <path d="M15,48 L20,35 L25,48 L30,35 L35,48 L40,35 L45,48 L50,35 L55,48 L60,35 L65,48 L70,35 L75,48 L80,35 L85,48" 
        fill="#5a5a5a" stroke="#1a1a1a" stroke-width="1"/>
        
  <!-- Jagged Teeth (Bottom Jaw) -->
  <path d="M15,52 L20,65 L25,52 L30,65 L35,52 L40,65 L45,52 L50,65 L55,52 L60,65 L65,52 L70,65 L75,52 L80,65 L85,52" 
        fill="#5a5a5a" stroke="#1a1a1a" stroke-width="1"/>
        
  <!-- Pressure Plate -->
  <circle cx="50" cy="50" r="15" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="1.5"/>
  
  <!-- Hinge Pins -->
  <circle cx="10" cy="50" r="3" fill="#1a1a1a"/>
  <circle cx="90" cy="50" r="3" fill="#1a1a1a"/>
</svg>
