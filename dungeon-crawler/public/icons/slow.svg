  <!-- Heavy bubbles -->
  <circle cx="11" cy="24" r="1.5" fill="#B39DDB" opacity="0.6"/>
  <circle cx="21" cy="22" r="1" fill="#B39DDB" opacity="0.5"/>
</svg>
