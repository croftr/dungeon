  <rect x="12" y="2" width="8" height="3" rx="1.5" fill="#6b7280"/>
  <!-- Cork -->
  <rect x="13" y="1" width="6" height="2" rx="1" fill="#a08060"/>
  <!-- Flask body -->
  <path d="M13 5 L13 12 L7 22 Q5 28 10 30 L22 30 Q27 28 25 22 L19 12 L19 5 Z"
        fill="#673AB7" stroke="#311B92" stroke-width="1.2" stroke-linejoin="round"/>
