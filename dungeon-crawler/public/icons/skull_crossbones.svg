<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#c8a84a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Skull -->
  <ellipse cx="32" cy="20" rx="12" ry="13" fill="none" stroke="#c8a84a" stroke-width="1.5"/>
  <!-- Eye sockets -->
  <circle cx="26" cy="18" r="2.5" fill="#c8a84a"/>
  <circle cx="38" cy="18" r="2.5" fill="#c8a84a"/>
  <!-- Nasal cavity -->
  <polygon points="32,22 30,25 34,25" fill="#c8a84a"/>
  <!-- Teeth -->
  <line x1="22" y1="28" x2="42" y2="28"/>
  <line x1="24" y1="28" x2="24" y2="30"/>
  <line x1="28" y1="28" x2="28" y2="30"/>
  <line x1="32" y1="28" x2="32" y2="30"/>
  <line x1="36" y1="28" x2="36" y2="30"/>
  <line x1="40" y1="28" x2="40" y2="30"/>
  <!-- Jaw -->
  <path d="M 22 28 Q 32 35 42 28" fill="none"/>
  <!-- Crossbones behind skull -->
  <line x1="12" y1="32" x2="52" y2="32" stroke="#c8a84a" stroke-width="1.5"/>
  <line x1="52" y1="22" x2="12" y2="42" stroke="#c8a84a" stroke-width="1.5"/>
  <!-- Bone knobs at ends -->
  <circle cx="10" cy="32" r="2" fill="#c8a84a"/>
  <circle cx="54" cy="32" r="2" fill="#c8a84a"/>
  <circle cx="54" cy="22" r="2" fill="#c8a84a"/>
  <circle cx="10" cy="42" r="2" fill="#c8a84a"/>
</svg>
