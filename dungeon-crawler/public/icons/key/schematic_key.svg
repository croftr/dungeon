<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="keyMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4d27a"/>
      <stop offset="50%" stop-color="#c89a3a"/>
      <stop offset="100%" stop-color="#7a5a18"/>
    </linearGradient>
    <radialGradient id="keyGem" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#9be8ff"/>
      <stop offset="60%" stop-color="#2e8fd8"/>
      <stop offset="100%" stop-color="#0c3a66"/>
    </radialGradient>
  </defs>

  <g transform="rotate(-30 32 32)">
    <!-- Bow (head) — hexagonal "schematic" frame -->
    <polygon points="32,4 48,13 48,31 32,40 16,31 16,13"
             fill="url(#keyMetal)" stroke="#3a2608" stroke-width="1.5"/>

    <!-- Inner hex pattern: blueprint lines -->
    <polygon points="32,10 43,16.5 43,27.5 32,34 21,27.5 21,16.5"
             fill="none" stroke="#3a2608" stroke-width="0.8" opacity="0.7"/>
    <line x1="32" y1="10" x2="32" y2="34" stroke="#3a2608" stroke-width="0.6" opacity="0.6"/>
    <line x1="21" y1="16.5" x2="43" y2="27.5" stroke="#3a2608" stroke-width="0.6" opacity="0.6"/>
    <line x1="43" y1="16.5" x2="21" y2="27.5" stroke="#3a2608" stroke-width="0.6" opacity="0.6"/>

    <!-- Central gem -->
    <circle cx="32" cy="22" r="4.5" fill="url(#keyGem)" stroke="#0c3a66" stroke-width="0.8"/>
    <circle cx="30.5" cy="20.5" r="1.2" fill="#e8f7ff" opacity="0.9"/>

    <!-- Shaft -->
    <rect x="30" y="38" width="4" height="18" fill="url(#keyMetal)" stroke="#3a2608" stroke-width="1"/>

    <!-- Teeth -->
    <rect x="34" y="46" width="6" height="3" fill="url(#keyMetal)" stroke="#3a2608" stroke-width="0.8"/>
    <rect x="34" y="52" width="4" height="3" fill="url(#keyMetal)" stroke="#3a2608" stroke-width="0.8"/>
    <rect x="34" y="56" width="6" height="3" fill="url(#keyMetal)" stroke="#3a2608" stroke-width="0.8"/>
  </g>
</svg>
